#
# Builds gcs_adc for every platform and publishes a GitHub release when a v* tag is pushed.
# See docs/releasing.md.
#
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v0.1.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build extension binaries
    permissions:
      actions: read
      contents: read
      packages: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: gcs_adc
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw'
      # Releases need every architecture, not the reduced PR matrix
      reduced_ci_mode: disabled
      # Ship httpfs, ui and the other extensions built with gcs_adc, not just gcs_adc
      upload_all_extensions: true
      override_repository: ${{ github.repository }}
      override_ref: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gcs_adc-*-extension-*
          path: artifacts

      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/gcs_adc-*-extension-*; do
            platform="${dir##*-extension-}"
            mapfile -t binaries < <(find "$dir" -name '*.duckdb_extension' -not -path '*/test-support/*' | sort)
            for required in gcs_adc httpfs ui; do
              if ! printf '%s\n' "${binaries[@]}" | grep -q "/${required}.duckdb_extension$"; then
                echo "::error::no ${required}.duckdb_extension in $dir"
                exit 1
              fi
            done
            bundle="dist/stage/${platform}"
            mkdir -p "$bundle"
            for binary in "${binaries[@]}"; do
              name="$(basename "$binary" .duckdb_extension)"
              gzip -9 -c "$binary" > "dist/${name}.${platform}.duckdb_extension.gz"
              cp "$binary" "$bundle/"
            done
            tar -C "$bundle" -czf "dist/gcs_adc-extensions.${platform}.tar.gz" .
          done
          rm -rf dist/stage
          (cd dist && sha256sum *.gz > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "gcs_adc $RELEASE_TAG" --generate-notes \
              --verify-tag $prerelease
          fi
