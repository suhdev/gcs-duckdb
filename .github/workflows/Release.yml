#
# Builds gcs_adc for every platform and publishes a GitHub release when a v* tag is pushed.
# See docs/releasing.md.
#
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v0.1.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build extension binaries
    permissions:
      actions: read
      contents: read
      packages: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: gcs_adc
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw'
      # Releases need every architecture, not the reduced PR matrix
      reduced_ci_mode: disabled
      override_repository: ${{ github.repository }}
      override_ref: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gcs_adc-*-extension-*
          path: artifacts

      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/gcs_adc-*-extension-*; do
            platform="${dir##*-extension-}"
            binary="$(find "$dir" -name 'gcs_adc.duckdb_extension' -not -path '*/test-support/*' | head -n 1)"
            if [ -z "$binary" ]; then
              echo "::error::no gcs_adc.duckdb_extension in $dir"
              exit 1
            fi
            gzip -9 -c "$binary" > "dist/gcs_adc.${platform}.duckdb_extension.gz"
          done
          (cd dist && sha256sum *.gz > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "gcs_adc $RELEASE_TAG" --generate-notes \
              --verify-tag $prerelease
          fi
