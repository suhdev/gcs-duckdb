site_name: gcs_adc for DuckDB
site_description: Read and write Google Cloud Storage from DuckDB with Application Default Credentials
site_url: https://suhdev.github.io/gcs-duckdb/
repo_url: https://github.com/suhdev/gcs-duckdb
repo_name: suhdev/gcs-duckdb
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Installation: installation.md
  - User guide:
      - Credential sources: guide/credential-sources.md
      - Creating secrets: guide/secrets.md
      - Diagnostics: guide/diagnostics.md
      - Settings: guide/settings.md
      - Troubleshooting: guide/troubleshooting.md
  - How it works: how-it-works.md
  - Development: development.md
  - Releasing: releasing.md
  - Specification: SPEC.md
  - Updating DuckDB: UPDATING.md
